<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body class="font-poppins">
    <header class="">
       <nav class="flex justify-between items-center w-[92%] mx-auto py-6">
            <div>
               <a href="index.html"><img class="w-24 pt-2 cursor-pointer" src="../images/Spartn. blk.svg" alt="..."></a>
            </div>
            <div class="nav-links duration-700 md:static absolute md:min-h-fit min-h-[60vh] left-0 top-[-100%] md:w-auto w-full flex items-center px-5 justify-center bg-white">
                <ul class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-6 text-center text-lg font-bold">
                    <li>
                        <a class="hover:text-gray-500" href="./company.html">Company Page</a>
                    </li>
                    <li>
                        <a class="hover:text-gray-500" href="./collection.html">Collection</a>
                    </li>
                    <li>
                        <a class="hover:text-gray-500" href="./product.html">Product</a>
                    </li>
                </ul>
            </div>
            <div class="flex items-center gap-6">
                <ion-icon class="text-xl" name="person-outline"></ion-icon>
                <ion-icon class="text-xl" name="bag-outline"></ion-icon>
                <ion-icon onclick="onToggleMenu(this); hide();" name="menu" size="medium" class="text-3xl cursor-pointer md:hidden ion-icon"></ion-icon>
            </div>
        </nav>
    </header>
    <body class="bg-gray-100">
      <!-- Checkout Container -->
      <div class="max-w-7xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Checkout</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- User Details Section -->
          <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Personal Information</h2>
            <form id="checkoutForm" action="#" method="POST">
              <div class="mb-4">
                <label for="name" class="block text-gray-700 mb-2">Full Name</label>
                <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
              <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
              <div class="mb-4">
                <label for="phone" class="block text-gray-700 mb-2">Phone Number</label>
                <input type="text" id="phone" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
    
              <!-- Marketing Subscription Checkbox -->
              <div class="mb-4">
                <label class="inline-flex items-center">
                  <input type="checkbox" checked id="subscribe" name="subscribe" class="w-4 h-4 text-black border-gray-300 rounded focus:ring-black">
                  <span class="ml-2 text-gray-700">Subscribe to marketing messages</span>
                </label>
                <p class="text-xs text-gray-500 mt-1">
                  By subscribing, you agree to receive promotional messages from us. You can unsubscribe at any time.
                </p>
              </div>
    
              <!-- Shipping Address -->
              <h2 class="text-xl font-semibold mb-4 mt-6">Shipping Information</h2>
              <div class="mb-4">
                <label for="address" class="block text-gray-700 mb-2">Address</label>
                <input type="text" id="address" name="address" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
              <div class="mb-4">
                <label for="city" class="block text-gray-700 mb-2">City</label>
                <input type="text" id="city" name="city" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="mb-4">
                  <label for="state" class="block text-gray-700 mb-2">State</label>
                  <input type="text" id="state" name="state" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
                </div>
                <div class="mb-4">
                  <label for="zip" class="block text-gray-700 mb-2">ZIP Code</label>
                  <input type="text" id="zip" name="zip" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
                </div>
              </div>
            </form>
          </div>
    
          <!-- Order Summary Section -->
          <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
            <div class="mb-4">
              <div class="flex justify-between items-center">
                <p class="text-gray-700">Item 1</p>
                <p class="text-gray-700">$50.00</p>
              </div>
              <div class="flex justify-between items-center">
                <p class="text-gray-700">Item 2</p>
                <p class="text-gray-700">$25.00</p>
              </div>
              <div class="flex justify-between items-center">
                <p class="text-gray-700">Shipping</p>
                <p class="text-gray-700">$5.00</p>
              </div>
              <hr class="my-4">
              <div class="flex justify-between items-center text-lg font-bold">
                <p>Total</p>
                <p>$80.00</p>
              </div>
            </div>
    
            <!-- Payment Information -->
            <h2 class="text-xl font-semibold mb-4 mt-6">Payment Information</h2>
            <div class="mb-4">
              <label for="card" class="block text-gray-700 mb-2">Credit Card Number</label>
              <input type="text" id="card" name="card" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="mb-4">
                <label for="expiry" class="block text-gray-700 mb-2">Expiry Date</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/YY" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
              <div class="mb-4">
                <label for="cvc" class="block text-gray-700 mb-2">CVC</label>
                <input type="text" id="cvc" name="cvc" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
              </div>
            </div>
    
            <!-- Place Order Button -->
            <button class="w-full bg-black text-white px-3 font-semibold py-3 rounded-md">
              Place Order
            </button>
          </div>
        </div>
      </div> 
    
  
    

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
    const navLinks = document.querySelector('.nav-links')
function onToggleMenu(e) {
  e.name = e.name === 'menu' ? 'close' : 'menu'
  navLinks.classList.toggle('top-[0%]')
}
function hide() {
  const x = document.getElementById ('tagline');
  if (x.style.display ==='none') {
    x.style.display = "flex"; }
    else {
      x.style.display = 'none'
    }
  }
</script>
</body>
</html>
