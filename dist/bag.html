<body class="font-poppins">

    <div class="container mx-auto py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 ml-4 text-center md:text-left">Your Bag</h1>
    
        <!-- Bag Items -->
        <div id="bagItems" class="bg-white p-6 rounded-lg shadow-lg">
            <!-- Items will be dynamically added here -->
        </div>
    
        <!-- Order Summary -->
        <div id="orderSummary" class="bg-white p-6 mt-6 rounded-lg shadow-lg">
            <!-- Summary will be dynamically added here -->
        </div>
    </div>
    
    <script>
    // Function to display cart items from localStorage
    function displayCart() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let bagItemsContainer = document.getElementById('bagItems');
        let orderSummaryContainer = document.getElementById('orderSummary');
        
        if (cart.length === 0) {
            bagItemsContainer.innerHTML = '<p>Your bag is empty.</p>';
            orderSummaryContainer.innerHTML = '';
            return;
        }
    
        let itemsHTML = '';
        let subtotal = 0;
    
        cart.forEach((product) => {
            const totalPrice = product.price * product.quantity;
            subtotal += totalPrice;
            itemsHTML += `
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <img src="${product.image}" alt="${product.name}" class="w-20 h-20 object-cover rounded-lg">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-700">${product.name}</h2>
                        <p class="text-gray-500">Size: ${product.size}</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <input type="number" value="${product.quantity}" min="1" class="w-16 p-2 border rounded-md" disabled>
                    <p class="text-lg font-semibold text-gray-700">$${totalPrice.toFixed(2)}</p>
                    <button class="text-red-500 hover:underline" onclick="removeFromBag(${product.id})">Remove</button>
                </div>
            </div>
            `;
        });
    
        // Update the DOM with the cart items
        bagItemsContainer.innerHTML = itemsHTML;
    
        // Calculate Order Summary
        const shipping = 0;
        const tax = subtotal * 0.08; // Example tax of 8%
        const total = subtotal + tax;
    
        // Update the DOM with the order summary
        orderSummaryContainer.innerHTML = `
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Order Summary</h2>
            <div class="flex justify-between mb-2">
                <p class="text-gray-600">Subtotal</p>
                <p class="text-gray-800">$${subtotal.toFixed(2)}</p>
            </div>
            <div class="flex justify-between mb-2">
                <p class="text-gray-600">Shipping</p>
                <p class="text-gray-800">$${shipping.toFixed(2)}</p>
            </div>
            <div class="flex justify-between mb-4">
                <p class="text-gray-600">Tax</p>
                <p class="text-gray-800">$${tax.toFixed(2)}</p>
            </div>
            <div class="flex justify-between font-semibold text-lg">
                <p>Total</p>
                <p>$${total.toFixed(2)}</p>
            </div>
            <button class="mt-6 w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600">
                Checkout
            </button>
        `;
    }
    
    // Function to remove item from cart
    function removeFromBag(productId) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart = cart.filter(product => product.id !== productId);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart(); // Refresh the cart display
    }
    
    // Display cart items on page load
    window.onload = displayCart;
    
    </script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

    <script src="./company.js"></script>
    <script>
        function toggleText() {
    var moreText = document.getElementById("moreText");
    var btnText = document.getElementById("readMoreBtn");

    if (moreText.classList.contains("hidden")) {
        moreText.classList.remove("hidden");
        btnText.textContent = "Read Less...";
    } else {
        moreText.classList.add("hidden");
        btnText.textContent = "Read More...";
    }
}
    </script>
</body>
